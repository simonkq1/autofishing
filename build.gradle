buildscript {
    repositories {
        maven {
            name = "Fabric"
            url = "https://maven.fabricmc.net/"
        }
        maven {
            name = "AliyunPublicMirror"
            url = "https://maven.aliyun.com/repository/public"
        }
        mavenCentral()
    }
    dependencies {
        classpath "net.fabricmc:fabric-loom:${loom_version}"
    }
}

apply plugin: "net.fabricmc.fabric-loom"
apply plugin: "maven-publish"

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

configurations.configureEach {
    exclude group: "net.fabricmc", module: "sponge-mixin"
}

repositories {
    maven {
        name = "Fabric"
        url = "https://maven.fabricmc.net/"
    }
    maven {
        name = "AliyunPublicMirror"
        url = "https://maven.aliyun.com/repository/public"
    }
    mavenCentral()
}

configurations {
    configSelfTestRuntime
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"

    implementation("net.fabricmc:fabric-loader:${project.loader_version}") {
        exclude group: "net.fabricmc", module: "sponge-mixin"
    }
    implementation fabricApi.module("fabric-lifecycle-events-v1", project.fabric_api_version)
    implementation fabricApi.module("fabric-key-mapping-api-v1", project.fabric_api_version)
    implementation fabricApi.module("fabric-command-api-v2", project.fabric_api_version)
    compileOnly files("libs/mixin-annotations-stub.jar")
    configSelfTestRuntime "com.google.code.gson:gson:2.14.0"

}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = "UTF-8"
}

tasks.register("configSelfTest", JavaExec) {
    group = "verification"
    description = "Runs dependency-free AutoFish configuration, timing and state tests."
    dependsOn testClasses
    classpath = files(sourceSets.test.output, sourceSets.main.output, configurations.configSelfTestRuntime)
    mainClass = "xyz.whatsyouss.frostyautofish.AutoFishSelfTest"
}

tasks.named("test") {
    enabled = false
}

check {
    dependsOn configSelfTest
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
    from("NOTICE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}
